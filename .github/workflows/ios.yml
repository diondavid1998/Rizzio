name: iOS

# The iOS code is edited in an environment without Xcode, so this is where it gets compiled.
# - Every push: build for the simulator (no signing, no secrets) to prove the code compiles.
# - Manual run with "testflight" checked: sign, archive and upload to TestFlight.
#   Needs repo secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (the full contents of the .p8 file).
on:
  push:
    branches: [main, 'claude/**']
    paths: ['ios/**', 'backend/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'backend/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload to TestFlight
        type: boolean
        default: false

concurrency:
  # Pushes cancel older push builds, but never a TestFlight upload in progress.
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: write  # lets the TestFlight run save the encrypted signing certificate once

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen

      - name: Build (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Rizzio.xcodeproj \
            -scheme Rizzio \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build.log

      - name: Show compiler errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -100 || true

      - name: Upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          ./scripts/testflight.sh

      # The first run with SIGNING_PASSWORD set creates one permanent certificate and saves it
      # (encrypted with that password) so every later build reuses it. Runs even if the upload failed,
      # so a certificate is never created twice.
      - name: Save signing certificate
        if: always() && github.event_name == 'workflow_dispatch' && inputs.testflight
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain ios/signing)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ios/signing
            git commit -m "Save encrypted distribution certificate"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  # Taps through every screen in an iPhone simulator, against the real backend running
  # in demo mode (RIZZIO_FAKE_AI=1: canned replies, no Claude key needed).
  ui-tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Start test server
        working-directory: backend
        run: |
          npm ci
          RIZZIO_FAKE_AI=1 APP_TOKEN=uitest-token PORT=4000 DB_PATH="$RUNNER_TEMP/uitest.sqlite" \
            nohup npm start > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:4000/health

      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Generate project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          phones = [(rt, d) for rt, ds in devices.items() if 'iOS' in rt for d in ds if d['name'].startswith('iPhone')]
          phones.sort(key=lambda p: p[0])
          print(phones[-1][1]['udid'] if phones else '')
          ")
          if [ -z "$UDID" ]; then
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x['identifier'] for x in json.load(sys.stdin)['runtimes'] if 'iOS' in x['identifier'] and x.get('isAvailable')]; print(r[-1] if r else '')")
            UDID=$(xcrun simctl create rizzio-ui "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME")
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run UI tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project Rizzio.xcodeproj \
            -scheme Rizzio \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/UITests.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            | tee "$RUNNER_TEMP/uitest.log" | grep -E "Test Case|error:|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/uitest.log"

      - name: Test summary
        if: always()
        run: |
          echo "## Rizzio UI tests" >> "$GITHUB_STEP_SUMMARY"
          grep -E "Test Case .*(passed|failed)" "$RUNNER_TEMP/uitest.log" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
          grep -E "error:" "$RUNNER_TEMP/uitest.log" | head -40 || true
          echo "--- server log ---"; tail -50 "$RUNNER_TEMP/server.log" || true

      - name: Upload screenshots and results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: ${{ runner.temp }}/UITests.xcresult
