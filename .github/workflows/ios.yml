name: iOS

# The iOS code is edited in an environment without Xcode, so this is where it gets compiled.
# - Every push: build for the simulator (no signing, no secrets) to prove the code compiles.
# - Manual run with "testflight" checked: sign, archive and upload to TestFlight.
#   Needs repo secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (the full contents of the .p8 file).
on:
  push:
    branches: [main, 'claude/**']
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload to TestFlight
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen

      - name: Build (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Rizzio.xcodeproj \
            -scheme Rizzio \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build.log

      - name: Show compiler errors
        if: failure()
        run: grep -E "error:|warning: .*deprecated" build.log | sort -u | head -100 || true

      - name: Upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          ./scripts/testflight.sh
