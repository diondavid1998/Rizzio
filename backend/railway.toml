[build]
# A Dockerfile instead of Railpack: Railpack downloads its tools from GitHub on every build,
# and those downloads kept failing with 504 errors.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node --disable-warning=ExperimentalWarning src/server.js"
healthcheckPath = "/health"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
