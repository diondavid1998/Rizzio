name = "rizzio-backend"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Model used for replies. Override here if you want faster/cheaper (e.g. "claude-sonnet-5-5").
RIZZIO_MODEL = "claude-opus-5-5"

# Secrets (set with `npx wrangler secret put <NAME>`, never commit them):
#   ANTHROPIC_API_KEY  - your Claude API key
#   APP_TOKEN          - any long random string; the iOS app sends it so strangers can't use your server
